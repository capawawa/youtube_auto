name: Dependency health

on:
  pull_request:
    paths:
      - ".github/dependabot.yml"
      - ".github/workflows/dependency-health.yml"
      - ".python-version"
      - "constraints-python312.txt"
      - "requirements.txt"
      - "tests/test_dependency_smoke.py"
      - "**.py"
  push:
    branches:
      - main
    paths:
      - ".github/dependabot.yml"
      - ".github/workflows/dependency-health.yml"
      - ".python-version"
      - "constraints-python312.txt"
      - "requirements.txt"
      - "tests/test_dependency_smoke.py"
      - "**.py"
  schedule:
    - cron: "41 8 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-python312.txt

      - name: Install constrained dependencies
        run: python -m pip install --requirement requirements.txt --constraint constraints-python312.txt

      - name: Validate dependency graph
        run: python -m pip check

      - name: Compile application
        run: python -m compileall -q -x "venv|__pycache__" .

      - name: Run dependency smoke tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
